# Retired site: inkmasterlink.netlify.app now permanently redirects to https://inkmasterlink.com.
# The old static files stay in the repo for history; public/_redirects forces a 301 on every path,
# and functions are no longer deployed.
[build]
publish = "public"
command = "echo 'Retired site: redirect-only deploy'"

[[redirects]]
from = "/*"
to = "https://inkmasterlink.com/"
status = 301
force = true
